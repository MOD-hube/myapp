<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>حارس العناصر</title>
<style>
:root{--bg:#0b120d;--panel:#171d16;--edge:#4a4630;--gold:#d8b24a;--text:#e8e4cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(3,9,5,.82) 100%)}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.stats{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:bold}
.hp{flex:1;height:14px;background:#220e0e;border:2px solid var(--edge);position:relative}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(#c43a2e,#7a1812)}
.chip{background:var(--panel);border:2px solid var(--edge);padding:2px 7px;color:var(--gold)}
.els{display:flex;justify-content:center;gap:8px;pointer-events:auto}
.els button{width:54px;height:54px;background:var(--panel);border:3px solid var(--edge);padding:6px;position:relative;box-shadow:0 3px 0 #000}
.els button svg{width:100%;height:100%}
.els button.on{border-color:var(--gold);background:#27301f;transform:translateY(2px);box-shadow:0 1px 0 #000}
.els button b{position:absolute;bottom:1px;right:3px;font-size:9px;color:#9a9}
#mm{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 100px);width:118px;height:118px;border:3px solid var(--edge);background:#050906;image-rendering:pixelated;box-shadow:0 0 0 2px #000,0 4px 0 #000;pointer-events:none}
#loc{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 222px);width:118px;text-align:center;font-size:11px;font-weight:bold;color:var(--gold);text-shadow:1px 1px 0 #000;pointer-events:none}
.sk{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:168px;height:206px;pointer-events:none}
.sk button{position:absolute;width:62px;height:62px;pointer-events:auto;background:var(--panel);border:3px solid var(--edge);padding:7px;overflow:hidden;box-shadow:0 3px 0 #000}
.sk .ic{display:block;width:100%;height:100%;position:relative;z-index:1}
.sk .ic svg{width:100%;height:100%}
.sk .cv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7);z-index:2}
.sk b{position:absolute;bottom:1px;left:3px;font-size:9px;color:#cbb;z-index:3}
.sk button.rd{border-color:var(--gold);box-shadow:0 0 12px #d8b24a99,0 3px 0 #000}
.sk button.sel{border-color:#7ae8ff;box-shadow:0 0 16px #7ae8ffcc,0 3px 0 #000;transform:translateY(2px)}
#mg{left:53px;top:0;background:#1f1a2a}
#mg.on{border-color:#c07aff;box-shadow:0 0 18px #c07affcc,0 3px 0 #000;background:#2f2244}
.sk button[data-s="0"]{left:53px;top:70px}
.sk button[data-s="1"]{left:0;top:140px}
.sk button[data-s="2"]{left:106px;top:140px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div id="top">
  <div class="stats">
    <div class="hp"><i id="hp"></i></div>
    <div class="chip">الموجة <span id="wv">1</span></div>
    <div class="chip">النقاط <span id="sc">0</span></div>
  </div>
  <div class="els" id="els">
    <button data-e="fire" class="on" aria-label="نار"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#ff7a1f"/><path d="M12 12c2 2 3 3 3 5a3 3 0 01-6 0c0-1 1-2 3-5z" fill="#ffd34a"/></svg><b>1</b></button>
    <button data-e="water" aria-label="ماء"><svg viewBox="0 0 24 24"><path d="M12 2c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z" fill="#4a72c4"/><path d="M9 14a3 3 0 002 3" stroke="#eaf2ff" stroke-width="1.6" fill="none"/></svg><b>2</b></button>
    <button data-e="air" aria-label="هواء"><svg viewBox="0 0 24 24" fill="none" stroke="#d8f4ff" stroke-width="2" stroke-linecap="square"><path d="M3 9h10a3 3 0 10-3-3M3 15h14a3 3 0 11-3 3M3 12h7"/></svg><b>3</b></button>
    <button data-e="stone" aria-label="حجارة"><svg viewBox="0 0 24 24"><polygon points="12,3 20,8 18,18 9,21 4,13" fill="#8d919a" stroke="#23252b" stroke-width="1.5"/><polygon points="12,3 20,8 14,10 8,8" fill="#bcc0c8"/></svg><b>4</b></button>
  </div>
</div>
<canvas id="mm" width="112" height="112"></canvas>
<div id="loc"></div>
<div class="sk">
  <button id="mg" aria-label="دمج"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6" fill="#ff7a1f" opacity=".9"/><circle cx="15" cy="12" r="6" fill="#4a72c4" opacity=".9"/><path d="M12 7l1.4 3.6L17 12l-3.6 1.4L12 17l-1.4-3.6L7 12l3.6-1.4z" fill="#fff"/></svg></span><b>F</b></button>
  <button data-s="0"><span class="ic"></span><i class="cv"></i><b>Q</b></button>
  <button data-s="1"><span class="ic"></span><i class="cv"></i><b>E</b></button>
  <button data-s="2"><span class="ic"></span><i class="cv"></i><b>R</b></button>
</div>
<script>
// ================= أدوات الرسم البكسلي =================
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hh=(a,b)=>{let n=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)%1000/1000};
const cv2=(w,h,s,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);c.w=w*s;c.h=h*s;return c};
function mk(rows,pal,s){const w=Math.max(...rows.map(r=>r.length));return cv2(w,rows.length,s,x=>rows.forEach((r,y)=>{for(let i=0;i<w;i++){const c=pal[r[i]];if(c){x.fillStyle=c;x.fillRect(i,y,1,1)}}}))}
const sh2=(h,f)=>{const n=parseInt(h.slice(1),16);return'#'+((1<<24)|(cl((n>>16&255)*f|0,0,255)<<16)|(cl((n>>8&255)*f|0,0,255)<<8)|cl((n&255)*f|0,0,255)).toString(16).slice(1)};
const mix=(a,b,k)=>{const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16),m=s=>Math.round((x>>s&255)*(1-k)+(y>>s&255)*k);return'#'+((1<<24)|(m(16)<<16)|(m(8)<<8)|m(0)).toString(16).slice(1)};
const gT=(p,sd)=>{const r=rng(sd);return cv2(16,16,2,x=>{x.fillStyle=p[0];x.fillRect(0,0,16,16);
 for(let i=0;i<7;i++){x.fillStyle=p[1];x.fillRect(r()*14|0,r()*14|0,2+(r()*3|0),1+(r()*2|0))}
 for(let i=0;i<5;i++){x.fillStyle=p[2];x.fillRect(r()*14|0,r()*15|0,2,1)}
 for(let i=0;i<5;i++){x.fillStyle=p[3];x.fillRect(r()*15|0,r()*14|0,1,2)}})};
function mkG(base,seed){return[0,1,2,3,4,5,6].map(k=>{let b;if(k<5)b=sh2(base,.78+.09*k);else b=mix(sh2(base,1.1),k==5?'#a09a68':'#bfae76',k==5?.5:.6);
 const p=[b,sh2(b,1.1),sh2(b,.86),sh2(b,1.28)];return[1,2,3].map(s=>gT(p,seed*97+k*9+s))})}
const mkP=(c,seed)=>[1,2,3].map(s=>{const r=rng(seed*31+s);return cv2(16,16,2,x=>{x.fillStyle=c;x.fillRect(0,0,16,16);for(let i=0;i<14;i++){x.fillStyle=i%2?sh2(c,.85):sh2(c,1.12);x.fillRect(r()*14|0,r()*15|0,2,1)}})});
const wT=(f,c)=>{const r=rng(5);return cv2(16,16,2,x=>{x.fillStyle=c;x.fillRect(0,0,16,16);for(let i=0;i<9;i++){x.fillStyle=i%3?sh2(c,.8):sh2(c,1.6);x.fillRect(((r()*13|0)+f*2)%14,r()*15|0,3,1)}})};
function pine(p,sd,h){const r=rng(sd),w=20;return cv2(w,h,3,x=>{const B=h-6,tl=B/4,c=w/2;
 for(let y=0;y<B;y++){const ti=y/tl|0,pp=(y%tl)/tl,hw=Math.max(0,.8+pp*(2+(ti+1)*1.5)+(r()<.35?1:0)-(r()<.25?1:0));
  for(let i=-hw;i<=hw;i++){const q=i/(hw||1);x.fillStyle=q<-.35?p[2]:q>.5?p[0]:p[1];if(r()<.12)x.fillStyle=p[3];x.fillRect(Math.round(c+i),y,1,1)}}
 x.fillStyle='#3a2a1c';x.fillRect(c-1,B,2,6);x.fillStyle='#241a10';x.fillRect(c,B,1,6)})}
const PN=[['#1c2e22','#27412e','#3a5c3c','#4b7048'],['#16261d','#213829','#31523a','#425f42'],['#232d1f','#31402a','#475e3a','#5f7a45'],['#0f1912','#16261a','#22382a','#2b4630']];
const OK=[['#3a2a14','#57401c','#7a5c28','#a08440'],['#1f3a24','#2f5a30','#477f3e','#6ea254'],['#4a2a10','#6e4018','#9a5c24','#c88a3c']];
function oak(p,sd,w,h){const r=rng(sd);return cv2(w,h,3,x=>{const th=Math.floor(h*.45),cx=w/2;
 for(let y=h-th;y<h;y++){const f=(y-(h-th))/th,hw=1+f*1.6;for(let i=-Math.ceil(hw);i<=hw;i++){x.fillStyle=i<-hw*.3?'#d6cfbb':i>hw*.5?'#3a3226':'#a39a84';if(r()<.14)x.fillStyle='#4a4234';x.fillRect(Math.round(cx+i),y,1,1)}}
 const bl=[];for(let b=0;b<11;b++)bl.push({x:cx+(r()-.5)*w*.62,y:(h-th)*.5+(r()-.5)*(h-th)*.5,r:w*.14+r()*w*.1});
 bl.sort((a,b)=>a.y-b.y);
 for(const o of bl)for(let j=-o.r;j<=o.r;j++)for(let i=-o.r;i<=o.r;i++){if(i*i+j*j>o.r*o.r)continue;const v=(i*.55+j*.85)/o.r+(r()-.5)*.35;x.fillStyle=v<-.55?p[3]:v<-.05?p[2]:v<.55?p[1]:p[0];x.fillRect(Math.round(o.x+i),Math.round(o.y+j),1,1)}})}
function dead(sd,h){const r=rng(sd);return cv2(14,h,3,x=>{const cx=7;
 for(let y=0;y<h;y++){x.fillStyle=y>h-9?'#5a4a5c':'#d8d0b8';x.fillRect(cx-1+(y<h*.3&&r()<.3?1:0),y,2,1);
  if(y%7==3&&y>6&&y<h-10){const s=r()<.5?-1:1;let bx=cx,by=y;const L=4+(r()*3|0);for(let k=0;k<L;k++){bx+=s;if(k%2)by--;x.fillStyle='#b8b098';x.fillRect(bx,by,1,1)}}}})}
function gold(sd){const r=rng(sd),w=24,h=44;return cv2(w,h,3,x=>{const cx=12;
 for(let y=16;y<h;y++){const hw=y>h-8?2:1;x.fillStyle='#6a7058';x.fillRect(cx-hw+((y*7%5)==0?1:0),y,hw*2,1);x.fillStyle='#454c3c';x.fillRect(cx+hw-1,y,1,1)}
 for(let b=0;b<14;b++){const bx=(cx+(r()-.5)*20)|0,by=(4+r()*22)|0,s=2+(r()*3|0);x.fillStyle='#e8b43a';x.fillRect(bx,by,s,s-1);x.fillStyle='#f6dc6a';x.fillRect(bx,by,1,1);x.fillStyle='#6a7058';x.fillRect(bx+(s>>1),by+s-1,1,3+(r()*5|0))}})}
function gnarl(sd,w,h){const r=rng(sd);return cv2(w,h,3,x=>{const cx=w/2,th=Math.floor(h*.62),top=h-th;let off=0;
 for(let y=h-1;y>=top;y--){const f=(h-1-y)/th;off+=Math.sin(y*.33+sd)*.3;const hw=2+(1-f)*3.6+Math.sin(y*.8)*.5;
  for(let i=-Math.ceil(hw);i<=hw;i++){const q=i/hw;x.fillStyle=q<-.3?'#8a9680':q>.4?'#3c4538':'#5c6852';if(r()<.12)x.fillStyle='#2e352c';x.fillRect(Math.round(cx+i+off),y,1,1)}}
 const bx=cx+off,cls=[];for(let b=0;b<15;b++)cls.push({x:cx+(r()-.5)*w*.86,y:2+r()*(top+6),rx:4+r()*6,ry:2+r()*2});
 for(const o of cls){const py=top+2,n=Math.max(4,Math.abs(o.x-bx)+Math.abs(o.y-py)|0);for(let s=0;s<=n;s++){x.fillStyle='#3c4538';x.fillRect(Math.round(bx+(o.x-bx)*s/n),Math.round(py+(o.y-py)*s/n),1,1)}}
 cls.sort((a,b)=>a.y-b.y);
 for(const o of cls)for(let j=-o.ry;j<=o.ry;j++)for(let i=-o.rx;i<=o.rx;i++){if((i*i)/(o.rx*o.rx)+(j*j)/(o.ry*o.ry)>1)continue;const v=(j/o.ry)*.7+(i/o.rx)*.3+(r()-.5)*.3;x.fillStyle=v<-.4?'#b4bc94':v<.1?'#9aa47c':v<.6?'#7e8a62':'#5e6c4a';x.fillRect(Math.round(o.x+i),Math.round(o.y+j),1,1)}})}
const plant=(sd,st,fl,fl2,wide)=>{const r=rng(sd);return cv2(14,16,2,x=>{const n=3+(r()*3|0);for(let i=0;i<n;i++){const px=1+Math.round(i*(11/n))+(r()*2|0),h=6+(r()*9|0);x.fillStyle=st;x.fillRect(px,16-h,1,h);
 if(r()<.7){x.fillRect(px-1,16-(h>>1),1,1);x.fillRect(px+1,16-(h>>1)-2,1,1)}const hh2=wide?2:4;x.fillStyle=fl;x.fillRect(wide?px-1:px,16-h-hh2+1,wide?3:1,hh2);x.fillStyle=fl2;x.fillRect(px,16-h-hh2+1,1,1)}})};
const tuft=(sd,c1,c2)=>{const r=rng(sd);return cv2(12,14,2,x=>{for(let i=0;i<8;i++){const px=1+(r()*10|0),h=4+(r()*9|0);x.fillStyle=i%2?c1:c2;x.fillRect(px,14-h,1,h);if(r()<.4)x.fillRect(px+1,14-h+1,1,2)}})};
const redsh=sd=>{const r=rng(sd);return cv2(16,12,2,x=>{for(let i=0;i<24;i++){const px=1+(r()*14|0),py=2+(r()*9|0);x.fillStyle=['#7a2e22','#a8442a','#c8602e'][r()*3|0];x.fillRect(px,py,1,2+(r()*2|0));if(r()<.5)x.fillRect(px+1,py+1,1,1)}})};
// لهب بكسلي
function flame(w,h,sd,fr){const r=rng(sd*7+fr*13+1);return cv2(w,h,3,x=>{const c=(w-1)/2;
 for(let i=0;i<w;i++){const f=1-Math.abs(i-c)/(c+.8),h2=Math.max(1,Math.round(h*.88*Math.pow(f,.85)*(.62+.38*r())));
  for(let j=0;j<h2;j++){const u=j/h2,core=f*(1-u*.8);x.fillStyle=core>.6?'#fff2b0':core>.42?'#ffd04a':core>.24?'#ff8a26':u>.75?'#a62a14':'#d8441c';x.fillRect(i,h-1-j,1,1)}}
 for(let k=0;k<3;k++){x.fillStyle=k%2?'#ffb23a':'#e8481e';x.fillRect(Math.round(c+(r()-.5)*w*.7),Math.floor(r()*h*.3),1,1)}})}
const FL=[[10,14],[14,20],[8,11]].map(([w,h],k)=>[0,1,2,3].map(f=>flame(w,h,k*5+3,f)));
// سحب دخان كرتونية
function cloud(sd,P){const r=rng(sd),w=18,h=14;return cv2(w,h,3,x=>{const bl=[],n=5+(r()*3|0);for(let i=0;i<n;i++)bl.push({x:4+r()*10,y:4+r()*6,r:3+r()*2.6});
 const inb=(i,j)=>bl.some(o=>(i-o.x)**2+(j-o.y)**2<=o.r*o.r);
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!inb(i,j))continue;const edge=!(inb(i+1,j)&&inb(i-1,j)&&inb(i,j+1)&&inb(i,j-1)),v=(i*.4+j*.9)/16+(r()-.5)*.2;
  x.fillStyle=edge?P[0]:v<.35?P[3]:v<.6?P[2]:P[1];x.fillRect(i,j,1,1)}})}
const CP={fire:['#5a2c10','#8a4a1c','#c47a30','#eaa850'],stone:['#2e3036','#5a5e66','#868a92','#bcc0c8'],water:['#2c4a86','#4a72c4','#7a9ee8','#d4e4ff'],air:['#6a8fa0','#a0c8d8','#d4f0fa','#ffffff']};
const CLD={};for(const k in CP)CLD[k]=[1,2,3].map(i=>cloud(i*17+k.length,CP[k]));
// صخور مضلّعة رمادية
const RP=['#23252b','#4a4d56','#6e727c','#9296a0','#bcc0c8'],IP=['#2a4478','#4a72c4','#7a9ee8','#b4ccf4','#eaf2ff'];
function rock(w,h,sd,kd,pal,moss,sc){pal=pal||RP;const r=rng(sd),sds=[],ns=3+(r()*3|0);
 for(let i=0;i<ns;i++){const yy=r()*h;sds.push({x:r()*w,y:yy,s:cl(.2+r()*.6+(1-yy/h)*.35,0,.99)})}
 const ins=(i,j)=>{if(i<0||j<0||i>=w||j>=h)return false;const u=(i+.5)/w*2-1,v=(j+.5)/h;
  if(kd=='spire')return Math.abs(u)<=.12+.88*Math.pow(v,.85)&&v>.02;
  if(kd=='slab'){const dy=(v-.62)/.4;return Math.pow(Math.abs(u),3)+dy*dy<=1}
  const dy=(v-.6)/.42;return u*u+dy*dy<=1};
 return cv2(w,h,sc||3,x=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!ins(i,j))continue;
  if(!(ins(i-1,j)&&ins(i+1,j)&&ins(i,j-1)&&ins(i,j+1))){x.fillStyle=pal[0];x.fillRect(i,j,1,1);continue}
  let b=1e9,s=.5;for(const q of sds){const d=(q.x-i)**2+((q.y-j)*1.3)**2;if(d<b){b=d;s=q.s}}
  s=cl(s-(i/w-.5)*.2,0,.99);let c=pal[1+Math.floor(s*4)];if(moss&&j<h*.5&&r()<.55)c=r()<.5?'#5e7a46':'#7e9c5a';
  x.fillStyle=c;x.fillRect(i,j,1,1)}})}
const RK={chunk:[rock(9,8,11,'blob'),rock(8,7,12,'blob'),rock(10,8,13,'slab')],deb:[rock(5,4,21,'blob',null,0,2),rock(4,4,22,'blob',null,0,2),rock(6,4,23,'slab',null,0,2)],
 small:[rock(7,5,31,'blob'),rock(9,4,32,'slab'),rock(6,6,33,'blob')],big:[rock(18,14,41,'blob'),rock(20,12,42,'slab'),rock(16,15,43,'blob')],
 spire:[rock(12,26,51,'spire'),rock(10,22,52,'spire')],sp:[rock(8,17,61,'spire'),rock(7,14,62,'spire')],moss:rock(28,20,71,'blob',null,1,4)};
const IK={sp:[rock(7,18,81,'spire',IP),rock(6,14,82,'spire',IP)]};
const TU=[tuft(61,'#c8b88a','#a89868'),tuft(62,'#d8c8a0','#b8a878'),tuft(63,'#1a1a1e','#34343c')],RS=[redsh(71),redsh(72)];
const S={
 tree:[pine(PN[0],3,40),pine(PN[1],4,46),pine(PN[2],5,36)],bpine:[pine(PN[3],6,58),pine(PN[3],7,50)],
 oakA:oak(OK[0],31,30,38),oakB:oak(OK[1],32,30,38),oakC:oak(OK[2],33,30,38),dead:[dead(41,52),dead(42,44),dead(43,62)],gold:gold(51),gn:[gnarl(81,44,64),gnarl(82,40,58)],
 pl:[plant(21,'#8a7a46','#d8c27a','#f0e2a0',0),plant(22,'#3b7048','#b83c9c','#e070c8',0),plant(23,'#3a6a4a','#e8d048','#fff08a',1),plant(24,'#3a6a4a','#cfe0e8','#fff',1)],
 stake:mk(["kk","kK","kk","kk","kK","kk","kk","kk","kK","kk"],{k:'#0e0e12',K:'#3a3a44'},3),
 spark:mk([".w.","www",".w."],{w:'#f4f8e8'},2),

  if(Math.hypot((i+.5-cx)/rxp,(j+.5-cy)/ryp)>1.16){ar+=sc[o];ag+=sc[o+1];ab+=sc[o+2];n++}}

  const lx=i+.5-cx,ly=j+.5-cy,nx=lx/rxp,ny=ly/ryp,a=Math.atan2(ny,nx),d=Math.hypot(nx,ny)/rho(a);

  for(const ox of[-9,0,9]){const xi=rd(cx+ox);let tj=0;for(let j=0;j<cap.height;j++)if(cd[(j*cap.width+xi)*4+3]){tj=j;break}

const hx=h=>{const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]};
const BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],bay=(i,j)=>BY[(i&3)+((j&3)<<2)]/16-.5;
const vn=(x,y,s)=>{const ix=fl(x),iy=fl(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hh(ix+s*57,iy+s*31),b=hh(ix+1+s*57,iy+s*31),c=hh(ix+s*57,iy+1+s*31),d=hh(ix+1+s*57,iy+1+s*31);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
const tri=z=>Math.abs((((z/PI)%2)+2)%2-1)*2-1;
const menuOn=()=>{const m=document.getElementById('mnu');return m&&m.style.display!=='none'};

/* لوحة الألوان: كحلي غامق ← أزرق ← أزرق فاتح ← أبيض */
const PAL=['#141d70','#1f38a4','#2f60d0','#4a9cf2','#9cd0ff','#e2f3ff','#ffffff'].map(hx);

const GW=44,GH=100,GX=22,GB=GH-4,SC=2,F=6,HF=80,LV=[.28,.5,.72,.9,1];

/* ---------- توليد إطار واحد من العمود (بكسل بكسل) ---------- */
function genG(v,gi,f){
 const g=LV[gi],sd=v*37+5,ph=f/F*TAU,Hp=HF*g,cs=.5+.5*g,capH=19*cs,hct=Math.max(7,Hp-capH*.62),
  D=new Uint8ClampedArray(GW*GH*4),
  put=(x,y,c)=>{x|=0;y|=0;if(x<0||y<0||x>=GW||y>=GH)return;const o=(y*GW+x)*4;D[o]=c[0];D[o+1]=c[1];D[o+2]=c[2];D[o+3]=255},
  hw=h=>5.4+2.3*Math.pow(1-cl(h/hct,0,1),1.4)+.6*Math.sin(h*.22+sd);
 /* خطوط الرغوة المتعرجة (البيضاء) */
 const SP=15,K=Math.ceil((hct+capH)/SP)+2,STR=[];
 for(let k=0;k<K;k++)STR.push({sl:(hh(k,sd)<.5?-1:1)*(.3+hh(k,sd+1)*.4),pp:hh(k,sd+2)*TAU,am:2+hh(k,sd+3)*2.2,th:2+hh(k,sd+4)*1.5});
 const scr=f/F*SP,LP=K*SP;
 /* شفرات جانبية مسنّنة */
 const M=Math.max(2,rd(hct/9)),BL2=[];
 for(const side of[-1,1])for(let j=0;j<M;j++)
  BL2.push({side,j,hs:(j+.15+hh(j,sd+side*5)*.5)/M*hct*.95,Hb:7+hh(j,sd+side*11)*5,L:(2.6+4.8*hh(j,sd+side*3))*(1.3-.7*((j+.5)/M))});
 for(let y=0;y<=GB;y++)for(let x=0;x<GW;x++){
  const h=GB-y,dx=x+.5-GX,ad=Math.abs(dx),sg=dx<0?-1:1,ahw=hw(h),inC=ad<=ahw&&h<=hct+capH*.45;
  let idx=-1;
  if(inC){
   const u=dx/ahw;
   let s=.42-u*.34+(vn(x*.28,h*.18,sd)-.5)*.22+cl(h/hct,0,1)*.08;
   if(vn(x*.14+sd,h*.1,sd+3)>.7&&u<.25)s+=.22;
   idx=cl(fl(s*6+bay(x,y)*.9),0,4);
   if(u>.82)idx=Math.max(0,idx-1);else if(u<-.8)idx=Math.min(4,idx+1);
   if(h<4)idx=Math.max(0,idx-1);
   let fo=-1;
   for(let k=0;k<K;k++){const s2=STR[k],w=h-((k*SP+scr)%LP)-dx*s2.sl-tri(dx*.7+s2.pp)*s2.am;
    if(w>=0&&w<s2.th){fo=0;break}
    const c=w>=-1.3&&w<0?1:w>=s2.th&&w<s2.th+1.3?2:w>=s2.th+1.3&&w<s2.th+2.6?3:-1;
    if(c>0&&(fo<0||c<fo))fo=c}
   if(fo>=0)idx=[6,5,4,0][fo];
  }else{
   for(const b of BL2){if(b.side!==sg)continue;const q=(h-b.hs)/b.Hb;if(q<0||q>1)continue;
    const out=b.L*(.86+.14*Math.sin(ph+b.j*1.7+b.side))*(q<.35?q/.35:(1-q)/.65),o=ad-ahw+.5;
    if(o>=0&&o<=out){idx=b.side<0?3:2;if(o>out*.6)idx++;if(q<.18||o<.8)idx--;idx=cl(idx,0,5);break}}
   if(idx<0&&h<10){
    const o=ad-ahw,lim=(10-h)*.85*(.65+.6*hh(fl(ad*.9)+(sg<0?0:9),sd+9))*(.88+.12*Math.sin(ph+sg));
    if(o>=0&&o<lim)idx=o>lim*.8?5:o>lim*.5?(sg<0?4:3):(sg<0?3:2)}
   if(idx<0&&h>3){
    const o=ad-ahw;
    if(o>0&&o<5.5)for(let k=0;k<K;k++){const s2=STR[k],w=h-((k*SP+scr)%LP)-dx*s2.sl-tri(dx*.7+s2.pp)*s2.am;
     if(w>=0&&w<s2.th*(1-o/5.5)){idx=o>2.5?5:6;break}}}
  }
  if(idx>=0)put(x,y,PAL[idx]);
 }
 /* ---------- قبعة الرغوة (سحابة بيضاء/زرقاء) ---------- */
 const cyc=GB-hct-capH*.1,
  CB=[[-7,4,5],[7,3.4,4.6],[0,1.6,8.8],[-6.6,-1.4,6.6],[5.6,-3,6],[-1,-6.4,6.8],[3.8,-8.2,5],[-6.6,-6.6,4.4],[.8,-10.8,3.4]];
 let minY=GH;
 for(let y=0;y<GB;y++)for(let x=0;x<GW;x++){
  let hit=-1,hnx=0,hny=0,hnz=0;
  for(let k=0;k<CB.length;k++){
   const b=CB[k],rb=b[2]*cs,bx=GX+(b[0]+Math.cos(ph+k)*.45)*cs,by=cyc+(b[1]+Math.sin(ph+k*1.3)*.7)*cs,
    dx2=x+.5-bx,dy2=y+.5-by,d2=dx2*dx2+dy2*dy2;
   if(d2<rb*rb){const nx=dx2/rb,ny=dy2/rb;hit=k;hnx=nx;hny=ny;hnz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny))}}
  if(hit<0)continue;
  const s=.5+(-.52*hnx-.72*hny)*.42+hnz*.3+(vn(x*.35,y*.35,sd+4)-.5)*.18;
  let idx=cl(fl(s*7+bay(x,y)*.9),1,6);
  if(vn(x*.5,y*.5,sd+9)>.8&&idx>2)idx-=2;
  put(x,y,PAL[idx]);if(y<minY)minY=y;
 }
 /* لمعات بيضاء في القبعة */
 for(const[gx,gy]of[[-4,-4],[2,-8],[-8,0],[0,-1]]){const px=GX+gx*cs,py=cyc+gy*cs;put(px,py,PAL[6]);put(px+1,py,PAL[5])}
 /* التفاف الموجة الصغير فوق القبعة + قطرة منفصلة */
 const cx0=GX+2.5*cs,cy0=minY-3,rc=3.4*cs;
 for(let i=0;i<=22;i++){const a=PI*(.1+1.55*i/22),px=cx0+Math.cos(a)*rc,py=cy0-Math.sin(a)*rc;
  put(px,py,i<4||i>19?PAL[6]:PAL[3]);if(i>3&&i<19)put(px+(Math.cos(a)>0?-1:1),py+1,PAL[5])}
 put(cx0+rc,cy0+1,PAL[3]);put(cx0+rc,cy0+2,PAL[2]);
 put(cx0+rc+2,cy0-4,PAL[6]);put(cx0+rc+3,cy0-4,PAL[4]);
 const c=mkc(GW,GH);c.getContext('2d').putImageData(new ImageData(D,GW,GH),0,0);c.w=GW*SC;c.h=GH*SC;return c;
}

/* تخزين مؤقت + تحضير تدريجي بدون تقطيع */
const CA={};
const getG=(v,gi,f)=>{const k=(v*5+gi)*F+f;return CA[k]||(CA[k]=genG(v,gi,f))};
const Qw=[];for(let v=0;v<3;v++)for(let gi=0;gi<5;gi++)for(let f=0;f<F;f++)Qw.push([v,gi,f]);
(function warm(){for(let i=0;i<3&&Qw.length;i++){const q=Qw.shift();getG(q[0],q[1],q[2])}if(Qw.length)setTimeout(warm,30)})();

/* قطرات جانبية مثل التي في الصورة */
const DP={w:'#ffffff',c:'#cfeaff',b:'#4a9cf2',n:'#1f38a4'};
const DR=[
 mk([".wwww..","wcbbbw.","wb..bbn","n....nn"],DP,2),
 mk(["..ww..",".wccw.","wcbbc.","wbnnb.",".bnn..","..n..."],DP,2),
 mk(["wwb.","wcbn",".bn.","..n."],DP,2)];
const SPK=['#ffffff','#9cd0ff','#4a9cf2'];

const GI=(()=>{const c=mkc(64,64),q=c.getContext('2d'),r=q.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'rgba(90,170,255,1)');r.addColorStop(.4,'rgba(90,170,255,.3)');r.addColorStop(1,'rgba(90,170,255,0)');
 q.fillStyle=r;q.fillRect(0,0,64,64);return c})();

/* ---------- رسم العمود في اللعبة ---------- */
function drawG(o){
 const sc=o.big||1,u=1-o.l/o.m;
 if(o.x<CX-220||o.x>CX+W+220||o.y<CY-340||o.y>CY+H+200)return;
 const v=(o.sd|0)%3;
 /* نمو سريع ← ثبات ← انهيار داخل الأرض */
 const lv=u<.2?4*(1-Math.pow(1-u/.2,2.2)):u<.74?4:4*(1-Math.pow((u-.74)/.26,1.6)),
  gi=cl(rd(lv),0,4),al=u<.05?u/.05:u>.9?(1-u)/.1:1,
  sink=u>.74?Math.pow((u-.74)/.26,2)*34*sc:0,
  f=((t*14)|0)%F,im=getG(v,gi,f),
  w=im.width*SC*sc,h=im.height*SC*sc,bx=o.x-GX*SC*sc,by=o.y-GB*SC*sc+sink;
 ctx.imageSmoothingEnabled=false;
 disc(o.x,o.y+2,17*sc*(.4+.15*gi),'#000000',.3*al,.4);
 /* حلقة تموّج على الأرض */
 if(u<.55){const k=u/.55,rr=(10+46*k)*sc,n=Math.max(14,rd(rr*.6));
  ctx.fillStyle='#9cd0ff';ctx.globalAlpha=(1-k)*.85*al;
  for(let i=0;i<n;i+=2){const a=i/n*TAU;ctx.fillRect(rd((o.x+Math.cos(a)*rr)/2)*2,rd((o.y+2+Math.sin(a)*rr*.45)/2)*2,2,2)}
  ctx.globalAlpha=1}
 /* العمود (يُقصّ عند خط الأرض فيبدو كأنه يغوص) */
 ctx.save();ctx.beginPath();const top=by-30;ctx.rect(o.x-w,top,w*2,o.y+10*sc-top);ctx.clip();
 ctx.globalAlpha=al;ctx.drawImage(im,rd(bx),rd(by),rd(w),rd(h));ctx.restore();ctx.globalAlpha=1;
 /* توهج أزرق خفيف */
 ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.28*al;
 ctx.drawImage(GI,o.x-64*sc,o.y-h*.7,128*sc,h*.8);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 /* قطرات ورذاذ متطاير حول العمود */
 const s2=fl(o.x*.37)+(o.sd|0)*5,hf=Math.min(1,lv/3+.2);
 for(let k=0;k<6;k++){
  const pu=cl((u-.12-k*.03)/.62,0,1);if(pu<=0)continue;
  const side=k&1?1:-1,a1=hh(k,s2),a2=hh(k+9,s2),a3=hh(k+19,s2),
   px=o.x+side*(16+14*a1+(30+34*a2)*pu)*sc,
   py=o.y-(26+54*a3)*sc*hf-(46+30*a2)*pu*sc+100*pu*pu*sc,d=DR[k%3];
  ctx.globalAlpha=al*(1-pu*pu);
  ctx.drawImage(d,rd(px-d.w/2),rd(py-d.h/2),rd(d.w*(sc>1?1.4:1)),rd(d.h*(sc>1?1.4:1)))}
 for(let k=0;k<12;k++){
  const pu=cl((u-.1-k*.025)/.6,0,1);if(pu<=0)continue;
  const side=k&1?1:-1,a1=hh(k+40,s2),a2=hh(k+50,s2),a3=hh(k+60,s2),
   px=o.x+side*(20+16*a1+(26+30*a2)*pu)*sc,py=o.y-(20+60*a3)*sc*hf-(36+40*a2)*pu*sc+90*pu*pu*sc;
  ctx.globalAlpha=al*(1-pu*pu);ctx.fillStyle=SPK[k%3];
  ctx.fillRect(rd(px/2)*2,rd(py/2)*2,2,2);if(k%3===0)ctx.fillRect(rd(px/2)*2+2,rd(py/2)*2+2,2,2)}
 ctx.globalAlpha=1}

/* ---------- الربط: استبدال رسم عمود الماء القديم ---------- */
let WSN=[];
const _d=draw;
draw=function(){
 WSN=er.filter(e=>e.el==='water');
 const e0=er;er=er.filter(e=>e.el!=='water');
 try{_d()}finally{er=e0}};
const _ds=dl.sort;
dl.sort=function(f){
 if(typeof P!=='undefined'&&P&&!menuOn())for(const o of WSN)dl.push([o.y+3,()=>drawG(o)]);
 return _ds.call(this,f)};
})();


</script>
</script>
