/* NOTIFICATIONS */
async function requestNotif(){
  if(!('Notification' in window)){toast('Notifications not supported');return false}
  try{
    const perm=await Notification.requestPermission();
    if(perm==='granted'){
      S.set.notif=true;ss('ap_set',JSON.stringify(S.set));
      try{new Notification('AttendPro',{body:'Notifications enabled ✓',icon:'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%231e5fa8%27/%3E%3Cpath d=%27M18 33l10 10 19-22%27 stroke=%27white%27 stroke-width=%278%27 fill=%27none%27/%3E%3C/svg%3E'})}catch(e){}
      return true
    }else{S.set.notif=false;ss('ap_set',JSON.stringify(S.set));return false}
  }catch(e){return false}
}
function sendNotif(title,body){
  if(!S.set.notif)return;
  if(!('Notification' in window))return;
  if(Notification.permission!=='granted')return;
  try{new Notification(title,{body:body,icon:'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%231e5fa8%27/%3E%3Cpath d=%27M18 33l10 10 19-22%27 stroke=%27white%27 stroke-width=%278%27 fill=%27none%27/%3E%3C/svg%3E'})}catch(e){}
}

let AC=null;
function tone(freq,dur,type,vol,when){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type=type||'sine';o.frequency.value=freq;f.type='lowpass';f.frequency.value=1800;f.Q.value=0.7;o.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function sfxSuccess(){tone(392,.35,'sine',.09,0);tone(523,.4,'sine',.08,.12);tone(659,.6,'sine',.07,.28);tone(784,.9,'sine',.05,.45)}
function sfxPop(){tone(600,.08,'sine',.05)}
function sfxTheme(){tone(523,.15,'sine',.06,0);tone(659,.2,'sine',.05,.08)}

/* CLOUD */
const cloudBase=()=>((S.set.cloud||CLOUD_URL||'').trim().replace(/\/+$/,''));
const kEmail=e=>e.toLowerCase().replace(/[^a-z0-9]/g,'_');
async function cf(path,method,body){const b=cloudBase();if(!b)throw new Error('nocloud');const r=await fetch(b+'/'+path+'.json',{method:method||'GET',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('http'+r.status);return r.json()}

function save(){
  if(!S.user)return;
  const email=S.user.email;
  S.db.t=Date.now();
  ss('ap_db_'+email,JSON.stringify(S.db));
  setSaveState('pending');
  if(cloudBase()){
    clearTimeout(pushT);
    pushT=setTimeout(async()=>{
      try{
        const k=kEmail(email);
        const payload={name:S.user.name,email:S.user.email,t:S.db.t,db:S.db};
        await cf('users/'+k,'PUT',payload);
        await cf('idx/'+k,'PUT',{name:S.user.name,email:S.user.email,t:S.db.t});
        setSaveState('saved');
        setSync('ok');
      }catch(e){
        setSaveState('error');
        setSync('err');
        console.error(e);
      }
    },300);
  }
}
function setSaveState(st){
  S.saveState=st;
  const p=$('saveState');
  if(p){p.className='pill '+st;p.textContent=st==='pending'?T('Saving'):st==='saved'?T('SavedOk'):T('Save failed')}
  if(st==='saved')setTimeout(()=>{S.saveState='';const q=$('saveState');if(q)q.className='pill';},1500);
}
let pushT=null;

async function pullMe(force){if(!cloudBase()||!S.user||S.back)return false;const k=kEmail(S.user.email);try{const ct=await cf('users/'+k+'/t');setSync('ok');if(ct==null){S.db.t=S.db.t||Date.now();save();return false}
 if(S.idxDone!=k){S.idxDone=k;cf('idx/'+k,'PUT',{name:S.user.name,email:S.user.email,t:ct}).catch(()=>{})}
 const lt=S.db.t||0;if(!force&&ct==lt)return false;if(!force&&ct<lt){save();return false}
 const r=await cf('users/'+k);if(r&&r.db){const d=norm(r.db);S.db=d;ss('ap_db_'+S.user.email,JSON.stringify(d));return true}return false}catch(e){setSync('err');return false}}

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ap|'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'ap|'+t)h=(h*33)^c.charCodeAt(0);return 'x'+(h>>>0).toString(16)}}
async function loadAdm(){S.admCfg=JSON.parse(sg('ap_admin')||'null');if(cloudBase()){try{S.admCfg=await cf('admin');if(S.admCfg)ss('ap_admin',JSON.stringify(S.admCfg));const r=await cf('users');S.cu=r||{};setSync('ok')}catch(e){setSync('err');toast('Cloud error — try again')}}}
function tchs(){const m={},l=JSON.parse(sg('ap_users')||'{}');for(const e in l)m[e]={name:l[e].name,email:e,d:ldb(e)};if(S.cu)for(const k in S.cu){const c=S.cu[k];if(!c||!c.email)continue;const e=c.email.toLowerCase(),cd=norm(c.db||{});if(!m[e]||cd.t>=(m[e].d.t||0))m[e]={name:c.name||e,email:e,d:cd};else m[e].name=c.name||m[e].name}return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name))}
let polling=0;
async function poll(){if(polling||!cloudBase()||!S.user||S.back||(typeof document!=='undefined'&&document.hidden))return;polling=1;try{let ch=await pullMe();if(S.view=='meo'&&S.adm&&!S.back){const ix=(await cf('idx'))||{};for(const k in ix){const have=S.cu&&S.cu[k]&&S.cu[k].t;if(!have||ix[k].t!=have){const r=await cf('users/'+k);if(r){(S.cu=S.cu||{})[k]=r;ch=true}}}}
 if(ch&&!S.modal&&!S.drawer&&!S.pop&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){if(S.view=='meo'&&S.mv=='find')doFind();else render()}}catch(e){setSync('err')}polling=0}

function cal(ymv,f,tap,sel){
  const[y,m]=ymv.split('-').map(Number),ws=S.set.lang=='ar'?6:0;
  const off=(new Date(y,m-1,1).getDay()-ws+7)%7,dim=new Date(y,m,0).getDate(),td=dstr(new Date());
  let cells='';for(let i=0;i<off;i++)cells+='<button class="o"></button>';
  for(let d=1;d<=dim;d++){const ds=ymv+'-'+pad(d),r=f(ds)||{};cells+=`<button class="${r.cls||''} ${ds==td?'t':''} ${ds==sel?'sel':''}" onclick="${tap(ds)}"><span>${d}</span>${r.dot!=null?`<i class="dt ${r.dot}"></i>`:''}</button>`}
  return `<div class="cal"><div class="ch"><button class="ib" style="background:var(--cd2);color:var(--ink);width:2.1rem;height:2.1rem" onclick="calNav(-1)">${ic('back',18)}</button><b>${new Date(y,m-1,1).toLocaleDateString(loc(),{month:'long',year:'numeric'})}</b><button class="ib nx" style="background:var(--cd2);color:var(--ink);width:2.1rem;height:2.1rem" onclick="calNav(1)">${ic('back',18)}</button></div><div class="cw">${[...Array(7)].map((_,i)=>`<span>${DS()[(ws+i)%7]}</span>`).join('')}</div><div class="cg">${cells}</div></div>`;

function pickImg(i,cb,max,sq){
  const f=i.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),g=c.getContext('2d');if(sq){const m=Math.min(im.width,im.height);c.width=c.height=max;g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,max,max)}else{const k=Math.min(1,max/im.width);c.width=im.width*k;c.height=im.height*k;g.drawImage(im,0,0,c.width,c.height)}cb(c.toDataURL('image/jpeg',.75))};im.onerror=()=>toast('Failed to load image');im.src=r.result};
  r.onerror=()=>toast('Failed to read file');
  r.readAsDataURL(f);
  i.value='';
}

function setWallFile(i){
  const f=i.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'),g=c.getContext('2d');
      const k=Math.min(1,1920/im.width);
      c.width=im.width*k;c.height=im.height*k;
      g.drawImage(im,0,0,c.width,c.height);
      setv('wall',c.toDataURL('image/jpeg',.78),true);
      toast('Background updated');
    };
    im.onerror=()=>toast('Failed to load image');
    im.src=r.result;
  };
  r.onerror=()=>toast('Failed to read file');
  r.readAsDataURL(f);
  i.value='';
}
