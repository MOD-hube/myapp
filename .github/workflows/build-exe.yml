name: Build EXE
on:
  push:
    paths:
      - 'desktop/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build portable EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --x64 --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "exe-${{ github.run_number }}" desktop/dist/*.exe --title "EXE Build ${{ github.run_number }}" --notes "EXE build" --target "${{ github.sha }}"
